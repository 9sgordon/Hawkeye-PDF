name: Build Hawkeye PDF for Windows

# Builds the Windows installer (.msi) and portable zip, and publishes them as a GitHub release
# that coworkers can download. Runs on every push to the hawkeye branch (except README/docs-only
# changes), on a tag starting with "v", or from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release with the installer (uncheck for a test build)"
        type: boolean
        default: true
  push:
    branches: [hawkeye]
    tags: ["v*"]
    paths-ignore: ["README.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: hawkeye-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DIST: ${{ github.workspace }}\dist\release
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: hawkeye-x64

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build installer and portable zip
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $msi = Get-ChildItem "$env:DIST\HawkeyePDF-*-windows-x64.msi" | Select-Object -First 1
          $v = $msi.Name -replace '^HawkeyePDF-', '' -replace '-windows-x64\.msi$', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Version-less copies give a link that always downloads the newest build:
          # https://github.com/<owner>/<repo>/releases/latest/download/HawkeyePDF-Setup.msi
          Copy-Item $msi.FullName "$env:DIST\HawkeyePDF-Setup.msi"
          Copy-Item (Get-ChildItem "$env:DIST\HawkeyePDF-*-windows-x64-portable.zip" | Select-Object -First 1).FullName "$env:DIST\HawkeyePDF-Portable.zip"
          Get-FileHash "$env:DIST\HawkeyePDF-Setup.msi", "$env:DIST\HawkeyePDF-Portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -FilePath "$env:DIST\SHA256SUMS.txt" -Encoding ascii

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HawkeyePDF-${{ steps.ver.outputs.version }}-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
            dist/release/SHA256SUMS.txt

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v${{ steps.ver.outputs.version }}-hawkeye.${{ github.run_number }}" }
          $notes = @"
          ## Install Hawkeye PDF (Windows)

          1. Download **HawkeyePDF-Setup.msi** below.
          2. Double-click it. If Windows says **"Windows protected your PC"**, click **More info**, then **Run anyway**.
          3. When asked **"Do you want to allow this app to make changes?"** (Publisher: Unknown), click **Yes**.
          4. Click through the installer. Hawkeye PDF appears in the Start menu and on the desktop.

          **No admin rights?** Download **HawkeyePDF-Portable.zip** instead, right-click it, choose **Extract All**, and run ``HawkeyePDF.exe`` from the extracted folder.

          The installer isn't code-signed, which is why Windows shows those warnings. Hawkeye PDF works offline and never uploads your documents.

          Built from PdfCraft (https://github.com/storytold/pdfcraft), MIT OR Apache-2.0.
          "@
          $files = @("$env:DIST\HawkeyePDF-Setup.msi", "$env:DIST\HawkeyePDF-Portable.zip", "$env:DIST\SHA256SUMS.txt")
          gh release create $tag @files `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Hawkeye PDF ${{ steps.ver.outputs.version }}" --notes $notes --latest
